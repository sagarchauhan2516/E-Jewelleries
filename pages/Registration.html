  <h1 class="text-center my-4">Registration Form</h1>
<form class="container registration-form" style="max-width: 600px;">
  
  <!-- First Name -->
  <div class="input-group mb-3">
    <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
    <input type="text" id="first-name" name="first-name" class="form-control" placeholder="First Name" required>
  </div>

  <!-- Last Name -->
  <div class="input-group mb-3">
    <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
    <input type="text" id="last-name" name="last-name" class="form-control" placeholder="Last Name" required>
  </div>

  <!-- Email -->
  <div class="input-group mb-3">
    <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
    <input type="email" id="email" name="email" class="form-control" placeholder="Email" required>
  </div>

  <!-- Phone Number -->
  <div class="input-group mb-3">
    <span class="input-group-text"><i class="fa-solid fa-phone"></i></span>
    <input type="tel" id="phone" name="phone" class="form-control" placeholder="Phone Number" required>
  </div>

  <!-- Username -->
  <div class="input-group mb-3">
    <span class="input-group-text"><i class="fa-solid fa-user-circle"></i></span>
    <input type="text" id="username" name="username" class="form-control" placeholder="Username" required>
  </div>

  <!-- DOB -->
 

  <!-- Password -->
  <div class="input-group mb-3">
    <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
    <input type="password" id="password" name="password" class="form-control" placeholder="Password" required>
  </div>

  <!-- Confirm Password -->
  <div class="input-group mb-3">
    <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
    <input type="password" id="confirm-password" name="confirm-password" class="form-control" placeholder="Confirm Password" required>
  </div>

  <!-- City -->
  <div class="input-group mb-3">
    <span class="input-group-text"><i class="fa-solid fa-city"></i></span>
    <input type="text" id="city" name="city" class="form-control" placeholder="City" required>
  </div>

  <!-- State -->
  <div class="input-group mb-3">
    <span class="input-group-text"><i class="fa-solid fa-flag"></i></span>
    <input type="text" id="state" name="state" class="form-control" placeholder="State" required>
  </div>

  <!-- Address -->
  <div class="input-group mb-3">
    <span class="input-group-text"><i class="fa-solid fa-location-dot"></i></span>
    <input type="text" id="address" name="address" class="form-control" placeholder="Address" required>
  </div>

  <!-- Zip Code -->
  <div class="input-group mb-4">
    <span class="input-group-text"><i class="fa-solid fa-envelope-open-text"></i></span>
    <input type="text" id="zip" name="zip" class="form-control" placeholder="Zip Code" required>
  </div>

  <!-- Submit -->
  <div class="text-center">
    <input type="submit" class="btn btn-primary px-4" value="Register">
  </div>

</form>
